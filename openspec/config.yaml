schema: spec-driven

context: |
  Tech stack:
    - Frontend: React 18, TypeScript, Create React App, Jest, Testing Library
    - Backend: Node.js, Express, TypeScript, Prisma, Swagger (OpenAPI)
  Conventions:
    - Plan mode then Act mode; plans must be approved before implementation
    - React: function components, typed props (interfaces), hooks at top level, controlled forms
    - Prefer composition over inheritance; memoize where appropriate
    - Backend: REST APIs documented with Swagger; Prisma for data access

rules:
  proposal:
    - Keep proposals focused; include a brief "Non-goals" section
    - Align with existing frontend/backend structure and tech stack
  specs:
    - Reference OpenAPI/Swagger for API contracts when applicable
    - Specify data models (Prisma schema) and UI behavior (React components) clearly
  tasks:
    - Break tasks into chunks of roughly 1–2 hours of work
    - Order tasks by dependency (e.g. API then frontend integration)
